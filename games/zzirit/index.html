<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>찌릿 마을의 불빛</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* layout: one game screen (240x176 pixel canvas, scaled) with dragon-quest style windows laid over it, touch pad underneath */
:root{
  --night:#0c0e1c;
  --panel:#05060c;
  --ink:#f3efe3;
  --frame:#e8e2cf;
  --volt:#ffd84a;
  --hurt:#ff7a66;
  --mana:#8fd0ff;
  --muted:#9a9cb4;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --text:"Nanum Gothic Coding","D2Coding","Malgun Gothic",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--text);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.top h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,5vw,34px);margin:0;color:var(--volt);letter-spacing:.02em;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:13px;letter-spacing:.06em}

.screen{position:relative;width:100%;aspect-ratio:240/176;background:#000;border-radius:6px;overflow:hidden;container-type:inline-size;box-shadow:0 0 0 2px #1d2036,0 18px 40px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.screen.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-1.4%,.6%)}40%{transform:translate(1.2%,-.8%)}60%{transform:translate(-.8%,.4%)}80%{transform:translate(.6%,0)}}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s}
.fade.on{opacity:1}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s steps(2) 2}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

.win{position:absolute;background:var(--panel);color:var(--ink);border:.45cqw solid var(--frame);border-radius:1.2cqw;box-shadow:inset 0 0 0 .5cqw var(--panel),inset 0 0 0 .75cqw #3a3d55;font-size:clamp(11px,3.3cqw,25px);line-height:1.55;padding:1.6cqw 2.4cqw}
.hud{top:2%;left:2%;min-width:30%;display:grid;grid-template-columns:auto auto;gap:0 2.2cqw;font-size:clamp(10px,2.9cqw,22px);padding:1.2cqw 2cqw}
.hud .nm{grid-column:1/-1;color:var(--volt);font-weight:700;border-bottom:.3cqw solid #3a3d55;margin-bottom:.4cqw}
.hud b{font-weight:700;font-variant-numeric:tabular-nums}
.hud .hp b{color:var(--ink)}
.hud.low .hp b{color:var(--hurt)}
.hud .x{grid-column:1/-1;color:var(--mana);font-size:.9em}
.foe{top:2%;right:2%;max-width:52%;font-size:clamp(10px,2.9cqw,22px);padding:1.2cqw 2cqw;text-align:right}
.foe .fn{color:var(--hurt);font-weight:700}
.foe .fx{color:var(--mana)}
.msg{left:2%;right:2%;bottom:2.5%;height:31%;overflow:auto;cursor:pointer;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.caret{position:absolute;right:2.4cqw;bottom:1.4cqw;width:1.6cqw;height:1.2cqw;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.menu{display:grid;grid-template-columns:repeat(var(--cols,1),auto);gap:.3cqw 2.4cqw;padding:1.4cqw 2.2cqw 1.4cqw 1.2cqw}
.menu.cmd{right:2%;bottom:36%}
.menu.cmd2{right:2%;bottom:36%;max-height:56%;overflow:auto}
.menu.wide{left:2%;right:2%;bottom:36%;grid-template-columns:1fr}
.menu.field{right:2%;top:2%}
.opt{all:unset;box-sizing:border-box;display:flex;gap:1.6cqw;align-items:baseline;padding:.2cqw 0 .2cqw 3.6cqw;position:relative;cursor:pointer;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.opt.on::before{content:"";position:absolute;left:.6cqw;top:.62em;width:1.6cqw;height:1.6cqw;background:var(--volt);clip-path:polygon(0 0,100% 50%,0 100%);animation:blink 1s steps(2) infinite}
.opt[aria-disabled="true"]{color:#666a80}
.opt small{font-size:.8em;color:var(--mana);margin-left:auto;padding-left:2cqw}
.opt:focus-visible{outline:.3cqw dashed var(--volt)}

.panel{inset:3%;overflow:auto;padding:2.4cqw 3.4cqw}
.panel h2{font-family:var(--display);font-weight:400;color:var(--volt);margin:0 0 1.4cqw;font-size:1.35em;letter-spacing:.03em}
.panel h3{margin:2cqw 0 .4cqw;font-size:1em;color:var(--mana)}
.panel p{margin:0 0 .8cqw;font-size:.92em;color:var(--ink)}
.panel .lock{color:#6a6e86}
.panel .close{all:unset;cursor:pointer;display:inline-block;margin-top:2cqw;color:var(--volt);border:.3cqw solid var(--volt);border-radius:1cqw;padding:.6cqw 2.4cqw}
.panel .stat{display:grid;grid-template-columns:auto 1fr;gap:.4cqw 3cqw;font-variant-numeric:tabular-nums}

.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqw;text-align:center;background:radial-gradient(ellipse at 50% 120%,rgba(255,216,74,.16),transparent 60%),linear-gradient(#070814,#11142a);padding:4cqw}
.titlecard .eyebrow{font-size:clamp(10px,2.6cqw,18px);letter-spacing:.3em;color:var(--muted)}
.titlecard h2{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(28px,10cqw,76px);line-height:1;color:var(--volt);text-shadow:0 0 2cqw rgba(255,216,74,.45),.5cqw .5cqw 0 #6b4a00}
.titlecard p{margin:0;font-size:clamp(11px,2.9cqw,20px);color:var(--ink);max-width:70cqw;word-break:keep-all}
.titlecard label{display:flex;gap:2cqw;align-items:center;font-size:clamp(11px,3cqw,20px)}
.titlecard input{font:inherit;font-family:var(--text);background:#000;color:var(--ink);border:.35cqw solid var(--frame);border-radius:1cqw;padding:.6cqw 1.6cqw;width:30cqw;text-align:center}
.titlecard input:focus{outline:.35cqw solid var(--volt)}
.titlecard .btns{display:flex;gap:2.4cqw;flex-wrap:wrap;justify-content:center}
.titlecard button{all:unset;cursor:pointer;font-family:var(--display);font-size:clamp(14px,4cqw,28px);padding:.8cqw 3.4cqw;border:.4cqw solid var(--frame);border-radius:1.2cqw;background:#000;color:var(--ink)}
.titlecard button.main{border-color:var(--volt);color:var(--volt)}
.titlecard button:hover,.titlecard button:focus-visible{background:#1b1e36}

.pad{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:4px 4px 0}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.pbtn{all:unset;box-sizing:border-box;display:grid;place-items:center;background:#1a1d33;border:2px solid #34385a;border-radius:10px;color:var(--ink);font-family:var(--display);font-size:20px;cursor:pointer;touch-action:none}
.pbtn:active,.pbtn.hold{background:#2b3058;border-color:var(--volt)}
.pbtn:focus-visible{outline:2px dashed var(--volt)}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.ab{display:flex;gap:12px;align-items:flex-end}
.ab .pbtn{width:72px;height:72px;border-radius:50%;font-size:22px;flex-direction:column;line-height:1.1}
.ab .pbtn span{font-family:var(--text);font-size:11px;color:var(--muted)}
.ab .a{border-color:#7a6a20;color:var(--volt);transform:translateY(-14px)}
.keys{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
.keys kbd{font-family:var(--text);background:#1a1d33;border:1px solid #34385a;border-radius:4px;padding:0 5px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.screen.shake,.flash.go,.caret,.opt.on::before{animation:none}}
</style>

<main class="wrap">
  <header class="top">
    <h1>찌릿 마을의 불빛</h1>
    <p>6학년 과학 · 전기의 이용 RPG</p>
  </header>

  <div class="screen" id="screen">
    <canvas id="cv" width="240" height="176" aria-label="게임 화면"></canvas>
    <div id="hud" class="win hud" hidden></div>
    <div id="foe" class="win foe" hidden></div>
    <div id="msg" class="win msg" hidden><div id="msgText"></div><span id="caret" class="caret" hidden></span></div>
    <div id="menu" class="win menu" hidden role="listbox"></div>
    <div id="panel" class="win panel" hidden></div>
    <div id="title" class="titlecard">
      <div class="eyebrow">전기의 이용 · 6학년</div>
      <h2>찌릿 마을의 불빛</h2>
      <p>단선마왕이 마을의 전기를 끊어 버렸다. 전기의 원리를 배워 마을에 다시 불을 밝히자!</p>
      <label for="nameIn">용사 이름 <input id="nameIn" maxlength="6" value="용사" autocomplete="off"></label>
      <div class="btns">
        <button id="btnNew" class="main">새로 시작</button>
        <button id="btnLoad" hidden>이어하기</button>
      </div>
    </div>
    <div id="flash" class="flash"></div>
    <div id="fade" class="fade"></div>
  </div>

  <div class="pad" aria-label="터치 조작">
    <div class="dpad">
      <button class="pbtn u" data-k="up" aria-label="위">▲</button>
      <button class="pbtn l" data-k="left" aria-label="왼쪽">◀</button>
      <button class="pbtn r" data-k="right" aria-label="오른쪽">▶</button>
      <button class="pbtn d" data-k="down" aria-label="아래">▼</button>
    </div>
    <div class="ab">
      <button class="pbtn b" data-k="b">B<span>메뉴·취소</span></button>
      <button class="pbtn a" data-k="a">A<span>말걸기·결정</span></button>
    </div>
  </div>
  <p class="keys">키보드: <kbd>방향키</kbd> 이동 · <kbd>Space</kbd> <kbd>Enter</kbd> 말걸기·결정 · <kbd>Esc</kbd> 메뉴·취소. 진행 상황은 이 기기에 자동 저장돼요.</p>
</main>

<script>

  after:['끊어진 전선뱀을 만나면 회로를 이어 버리렴. 끊어진 곳을 이으면 전기가 흐르니까!']},
 pluck:{who:'가로등지기',title:'전구의 직렬연결과 병렬연결',
  lines:['가로등 전구는 어떻게 이을지가 아주 중요해.','전구 여러 개를 한 줄로 이으면 전구의 직렬연결이야.','여러 갈래로 나누어 하나씩 이으면 전구의 병렬연결이지.','같은 전지라면 병렬로 이은 전구가 직렬로 이은 전구보다 더 밝아.','직렬은 전구 하나를 빼면 나머지도 모두 꺼져. 병렬은 하나를 빼도 나머지는 그대로 켜져 있어.'],

  note:'직렬연결: 전구를 한 줄로 잇는다. 전구 하나를 빼면 모두 꺼지고, 병렬보다 어둡다. 병렬연결: 전구를 여러 갈래로 나누어 잇는다. 하나를 빼도 나머지는 켜져 있고, 직렬보다 밝다.',

const msg=$('msg'),msgText=$('msgText'),caret=$('caret'),menu=$('menu'),panel=$('panel'),hudEl=$('hud'),foeEl=$('foe');
const ui={typing:false,skip:false,msgResolve:null,menu:null,panel:null,tok:0};
function typeText(line){return new Promise(res=>{const tok=++ui.tok;msg.hidden=false;msgText.textContent='';caret.hidden=true;let i=0;ui.typing=true;ui.skip=false;const step=()=>{if(tok!==ui.tok)return res();i=ui.skip?line.length:i+1;msgText.textContent=line.slice(0,i);if(i<line.length)setTimeout(step,20);else{ui.typing=false;res()}};step()})}
async function sayOne(line){await typeText(line);caret.hidden=false;await new Promise(r=>ui.msgResolve=r);caret.hidden=true}

function closeMsg(){ui.tok++;ui.typing=false;msg.hidden=true}
function choose(opts,{cancel=true,where='cmd',cols=1,onSel}={}){
 return new Promise(res=>{
  menu.className='win menu '+where;menu.style.setProperty('--cols',cols);menu.innerHTML='';menu.hidden=false;
  const n=opts.length;let idx=0;
  const items=opts.map(o=>typeof o==='string'?{label:o}:o);
  const btns=items.map((o,i)=>{const b=document.createElement('button');b.className='opt';b.type='button';b.setAttribute('role','option');b.textContent=o.label;if(o.sub){const s=document.createElement('small');s.textContent=o.sub;b.appendChild(s)}if(o.disabled)b.setAttribute('aria-disabled','true');b.addEventListener('click',e=>{e.stopPropagation();sel(i);finish(i)});b.addEventListener('pointerenter',()=>sel(i));menu.appendChild(b);return b});
  function sel(i){idx=i;btns.forEach((b,j)=>b.classList.toggle('on',j===i));if(onSel)onSel(i)}
  function done(v){ui.menu=null;menu.hidden=true;res(v)}
  function finish(i){if(items[i].disabled){if(items[i].why)setLine(items[i].why);return}done(i)}
  sel(0);
  ui.menu={key(k){const rows=Math.ceil(n/cols);
   if(k==='up')sel((idx-cols+n)%n);else if(k==='down')sel((idx+cols)%n);
   else if(k==='left')sel(cols>1?(idx-1+n)%n:(idx-1+n)%n);else if(k==='right')sel((idx+1)%n);
   else if(k==='a')finish(idx);else if(k==='b'&&cancel)done(-1)}};
 })
}
async function ask(text,opts,o={}){show(text);return choose(opts,Object.assign({where:'wide',cancel:false},o))}
/* question with shuffled options; returns true when right */
async function quiz(q){
 const order=q.opts.map((_,i)=>i).sort(()=>Math.random()-.5);
 const i=await ask(q.q,order.map(k=>q.opts[k]));
 return order[i]===q.ans;
}

 if(ui.msgResolve&&(k==='a'||k==='b')){const r=ui.msgResolve;ui.msgResolve=null;r();return}

const CODES={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',Space:'a',Enter:'a',NumpadEnter:'a',KeyZ:'a',KeyJ:'a',Escape:'b',KeyX:'b',KeyK:'b'};

 if(document.activeElement&&document.activeElement.tagName==='INPUT'){if(e.code==='Enter')$('btnNew').click();return}
 const k=CODES[e.code];if(!k)return;e.preventDefault();
 if(['up','down','left','right'].includes(k)){if(!e.repeat&&!dirs.includes(k))dirs.push(k);if(ui.menu||ui.panel)press(k)}else if(!e.repeat)press(k);
});
addEventListener('keyup',e=>{const k=CODES[e.code];const i=dirs.indexOf(k);if(i>=0)dirs.splice(i,1)});
addEventListener('blur',()=>dirs.length=0);
document.querySelectorAll('.pbtn').forEach(b=>{
 const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('hold');try{b.setPointerCapture(e.pointerId)}catch(_){}if(['up','down','left','right'].includes(k)){if(!dirs.includes(k))dirs.push(k);if(ui.menu||ui.panel)press(k)}else press(k)});
 const up=()=>{b.classList.remove('hold');const i=dirs.indexOf(k);if(i>=0)dirs.splice(i,1)};
 b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
 b.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();e.stopPropagation();press(k)}});
});

function makeEnemy(key){const m=MON[key];const E=Object.assign({key},JSON.parse(JSON.stringify(m)));E.tags=new Set(m.tags);E.maxHp=E.hp;E.hitT=0;if(key==='bat')E.pole=Math.random()<.5?'N':'S';if(E.boss)E.phase=1;return E}
const alive=E=>E.tags.has('parallel')?E.bulbs.some(b=>b>0):E.hp>0;
async function battle(key){
 const E=makeEnemy(key);battleE=E;
 await flash();mode='battle';foeHud(E);hud();
 await say(E.intro);
 if(key==='bat'){await say(`가슴의 ${E.pole}극이 이쪽을 향하고 있다.`)}
 let result=null;
 while(!result){
  result=await playerTurn(E);
  foeHud(E);hud();
  if(result)break;
  if(!alive(E)){result='win';break}
  if(G.hp<=0){result='lose';break}
  await enemyTurn(E);foeHud(E);hud();
  if(G.hp<=0)result='lose';
 }
 if(result==='win'){
  G.stats.kills++;
  if(E.boss){mode='field';battleE=null;foeHud(null);return ending()}
  G.exp+=E.exp;G.gold+=E.gold;
  await say([`${jo(E.name,'을','를')} 물리쳤다!`,`경험치 ${E.exp}, 금화 ${E.gold}G를 얻었다.`]);
  while(G.lv<NEXT.length-1&&G.exp>=NEXT[G.lv+1]){G.lv++;G.maxHp+=6;G.maxMp+=3;G.hp=Math.min(G.maxHp,G.hp+6);G.mp=Math.min(G.maxMp,G.mp+3);hud();await say(`레벨이 올랐다! ${jo(G.name,'은','는')} 이제 Lv ${G.lv}. 최대 HP와 MP가 늘었다.`)}
 }
 if(result==='lose'){
  await say(['눈앞이 캄캄해졌다…']);
  await fade(()=>{mode='field';battleE=null;foeHud(null);G.map='town';G.x=8;G.y=14;G.dir='up';G.hp=G.maxHp;G.mp=G.maxMp;G.gold=Math.floor(G.gold/2);G.boost=false;buildMap()});
  hud();await say(['정신을 차려 보니 마을 여관이었다.','가진 돈의 절반을 잃었다. 다시 힘을 내자!']);
 }
 mode='field';battleE=null;foeHud(null);G.boost=false;save();
}

  if(c===0){await attack(E);return null}
  if(c===1){
   const ids=G.spells;
   const s=await choose(ids.map(id=>({label:SPELLS[id].name,sub:SPELLS[id].mp+'MP',disabled:G.mp<SPELLS[id].mp,why:'MP가 모자라다.'})),{where:'cmd2',onSel:i=>setLine(SPELLS[ids[i]].desc)});
   if(s<0)continue;await cast(ids[s],E);return null;
  }
  if(c===2){if(await useItemMenu(true))return null;continue}
  if(c===3){if(E.boss){await say('도망칠 수 없다!');return null}if(Math.random()<.6){await say(`${jo(G.name,'은','는')} 재빨리 도망쳤다.`);return 'flee'}await say('도망치지 못했다!');return null}

async function hit(E,n,big){

 if(E.tags.has('parallel')){

  if(E.bulbs[i]===0)await say(E.bulbs.some(b=>b>0)?'전구 하나가 꺼졌다. 다른 갈래의 전구는 그대로 켜져 있다!':'마지막 전구가 꺼졌다!');
  return;
 }
 E.hp=Math.max(0,E.hp-n);foeHud(E);
 await say(`${big?'효과가 굉장하다! ':''}${E.name}에게 ${n}의 피해를 주었다!`);
}

   if(E.tags.has('parallel')){const i=E.bulbs.findIndex(b=>b>0);E.bulbs[i]=0;E.hitT=performance.now()+420;foeHud(E);return say(['전구 하나를 쏙 뽑았다!',E.bulbs.some(b=>b>0)?'하지만 다른 갈래의 전구는 여전히 환하게 켜져 있다! 병렬연결은 갈래가 따로따로이기 때문이다.':'마지막 전구까지 꺼졌다!'])}
   if(E.boss&&E.phase===1){E.phase=2;E.hitT=performance.now()+420;foeHud(E);await say(['수정 하나를 쏙 뽑았다!','한 줄로 이어진 수정 방패가 한꺼번에 꺼졌다! 직렬연결의 약점이다.']);return say(['단선마왕: 크윽… 제법이구나.','단선마왕: 하지만 이 강철 갑옷은 뚫지 못할 것이다!'])}

   }

async function safetyTrick(E){

async function enemyTurn(E){

 return hurt(Math.max(1,a+rnd(0,2)-def()));
